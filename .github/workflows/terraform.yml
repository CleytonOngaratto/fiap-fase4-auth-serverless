name: Terraform - Auth Serverless (API Gateway persistente + borda de sessao)

# Sem filtro de caminho no pull_request: workflow pulado por filtro deixa o check obrigatório "Pending" e trava o merge.
on:
  pull_request:
    branches: [ "main" ]
  # O push na main aplica só o session/; o persistent/ (URL que vai para o painel do Mercado Pago) só sobe por dispatch.
  push:
    branches: [ "main" ]
    paths: [ "session/**", ".github/workflows/terraform.yml" ]
  workflow_dispatch:
    inputs:
      root:
        description: "Root do Terraform"
        type: choice
        required: true
        default: session
        options: [ session, persistent ]
      action:
        description: "O que executar"
        type: choice
        required: true
        default: plan
        options: [ plan, apply, destroy ]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  NODE_VERSION: "20"
  TF_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.root || 'session' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Lambda dependencies
        run: npm ci --omit=dev --prefix lambda

      - name: Test Lambda
        run: node --test tests/

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init e validate (persistent/)
        run: |
          terraform -chdir=persistent init -backend=false -input=false
          terraform -chdir=persistent validate

      - name: Terraform init e validate (session/)
        run: |
          terraform -chdir=session init -backend=false -input=false
          terraform -chdir=session validate

  terraform:
    needs: fmt-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    # No job, não no workflow: um apply em curso não pode enfileirar nem cancelar o fmt-validate de um PR.
    # Sem cancel-in-progress: abortar um apply no meio deixa recursos fora do state.
    concurrency:
      group: terraform-auth-${{ github.event_name == 'workflow_dispatch' && inputs.root || 'session' }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Só funciona logo após o configure-aws-credentials: com token expirado ele falha antes de qualquer outro step.
      - name: Lab session expirada?
        if: failure()
        run: |
          echo "::error::Credencial do AWS Academy expirou ou esta invalida (a sessao dura ~4h)."
          echo "::error::Abra o lab, atualize ~/.aws/credentials e rode, no repo de plataforma:"
          echo "::error::  fiap-fase4-infra-k8s/scripts/refresh-gh-secrets.ps1 -Org CleytonOngaratto"
          echo "::error::O AWS_SESSION_TOKEN e obrigatorio; sem ele o erro vem como InvalidClientTokenId."

      - name: Check lab session
        run: aws sts get-caller-identity

      - name: Check repository variables
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Repository variable TF_STATE_BUCKET nao definida (valor: o bucket criado pelo bootstrap-backend.ps1 da plataforma)."
            echo "::error::Settings > Secrets and variables > Actions > Variables (NAO e um secret)."
            exit 1
          fi

      - name: Check upstream contract (SSM)
        if: env.TF_ROOT == 'session'
        run: |
          set -euo pipefail
          missing=0
          check() {
            if ! aws ssm get-parameter --name "$1" > /dev/null 2>&1; then
              echo "::error::Parametro ausente no SSM: $1 - quem publica: $2"
              missing=1
            fi
          }
          check /fase4/vpc/id              "fiap-fase4-infra-k8s"
          check /fase4/vpc/private-subnets "fiap-fase4-infra-k8s"
          check /fase4/alb/listener-arn    "fiap-fase4-infra-k8s"
          check /fase4/alb/sg-id           "fiap-fase4-infra-k8s"
          check /fase4/apigw/api-id        "root persistent/ deste repositorio (workflow_dispatch, uma vez por conta do lab)"
          if [ "$missing" -eq 1 ]; then
            echo "::error::Ordem de deploy: plataforma -> infra dos servicos -> deploy dos servicos -> borda."
            echo "::error::No destroy a plataforma tem de estar de pe: os data sources leem estes parametros."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.4
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir="$TF_ROOT" init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=auth-serverless/${TF_ROOT}.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform -chdir="$TF_ROOT" validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: |
          terraform -chdir="$TF_ROOT" plan -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan ($TF_ROOT/)"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform -chdir="$TF_ROOT" apply -auto-approve tfplan

      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform -chdir="$TF_ROOT" destroy -auto-approve

      - name: Smoke test pelo Gateway
        if: |
          env.TF_ROOT == 'session' && (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_dispatch' && inputs.action == 'apply'))
        run: |
          set -euo pipefail
          api=$(aws ssm get-parameter --name /fase4/apigw/url --query Parameter.Value --output text)

          check() {
            local path="$1" want="$2" code=""
            for _ in $(seq 1 12); do
              code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$api$path" || true)
              if [ "$code" = "$want" ]; then
                break
              fi
              sleep 10
            done
            echo "GET $path -> $code (esperado $want)"
            [ "$code" = "$want" ]
          }

          check /billing/v1/info 200
          check /execution/v1/info 200
          check /carworkshop/v1/tracking/1 401
          check /carworkshop/v1/q/health/ready 404

      - name: Show outputs
        if: success() && github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.action == 'destroy')
        run: terraform -chdir="$TF_ROOT" output || true
